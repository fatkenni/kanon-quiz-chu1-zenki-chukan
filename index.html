      const chips = el('div', { class: 'daily-sessions' });
      sessions.forEach(s => {
        const subj = SUBJECTS.find(x => x.id === s.subject);
        if (!subj) return;
        chips.appendChild(el('span', {
          class: 'session-chip',
          style: 'background:' + subj.color + '1f; color:' + subj.color + '; border-color:' + subj.color + '44'
        },
          subj.emoji + ' ' + s.correct + '/' + s.total + (s.reviewMode ? ' ✦' : '')
        ));
      });

      // 詳細部分：その日の各セッションを時刻順に列挙
      const detailBody = el('div', { class: 'daily-detail-body' });
      const sortedSessions = sessions.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0));
      sortedSessions.forEach((s, idx) => {
        const subj = SUBJECTS.find(x => x.id === s.subject);
        if (!subj) return;
        const sPct = Math.round(100 * s.correct / s.total);
        const sTime = new Date(s.ts || 0);
        const timeStr = String(sTime.getHours()).padStart(2, '0') + ':' + String(sTime.getMinutes()).padStart(2, '0');
        const durMin = Math.floor((s.durationSec || 0) / 60);
        const durSec = (s.durationSec || 0) % 60;
        const durStr = (durMin > 0 ? durMin + '分' : '') + durSec + '秒';
        detailBody.appendChild(el('div', { class: 'daily-detail-row' },
          el('span', { class: 'detail-time' }, timeStr),
          el('span', { class: 'detail-subj', style: 'color:' + subj.color }, subj.emoji + ' ' + subj.ja),
          el('span', { class: 'detail-score' }, s.correct + '/' + s.total + ' (' + sPct + '%)'),
          el('span', { class: 'detail-dur' }, '⏱ ' + durStr),
          s.reviewMode ? el('span', { class: 'detail-tag' }, '復習') : null
        ));
      });

      const summary = el('summary', { class: 'daily-summary' },
        el('div', { class: 'daily-date' },
          el('div', { class: 'daily-day' }, dateLabel),
          el('div', { class: 'daily-dow' }, '(' + dowLabel + ')')
        ),
        el('div', { class: 'daily-body' },
          el('div', { class: 'daily-total' }, total + '問・' + pct + '%'),
          chips
        )
      );

      const dailyItem = el('details', {
        class: 'daily-item' + (isToday ? ' is-today' : ''),
        id: 'daily-' + date,
        open: isToday  // 当日のみ最初から開いておく
      }, summary, detailBody);
      list.appendChild(dailyItem);
    });
    root.appendChild(list);
  }

  // ===== 3. テスト範囲の網羅率 =====
  root.appendChild(el('div', { class: 'section-label' }, '📈 テスト範囲の網羅率', el('div', { class: 'deco' })));
  root.appendChild(el('div', { class: 'coverage-note' },
    '一度でも解いた問題の割合を表示。タップで単元別の詳細が開きます。'));
  for (const s of SUBJECTS) {
    const cov = getCoverage(s.id);
    if (cov.total === 0) continue;
    const byTopic = getCoverageByTopic(s.id);

    const summary = el('summary', null,
      el('span', { class: 'cov-emoji' }, s.emoji),
      el('span', { class: 'cov-subject' }, s.ja),
      el('span', { class: 'cov-bar' },
        el('span', { class: 'cov-fill', style: 'width:' + cov.pct + '%; background:' + s.color })
      ),
      el('span', { class: 'cov-pct' }, cov.pct + '%')
    );
    const body = el('div', { class: 'cov-body' });
    body.appendChild(el('div', { class: 'cov-summary' },
      '完了 ' + cov.seen + '問 / 全' + cov.total + '問'
    ));
    byTopic.forEach(t => {
      body.appendChild(el('div', { class: 'cov-topic-row' + (t.pct < 50 ? ' needs-work' : '') },
        el('span', { class: 'cov-topic-name' }, t.name),
        el('span', { class: 'cov-topic-bar' },
          el('span', { class: 'cov-topic-fill', style: 'width:' + t.pct + '%; background:' + s.color })
        ),
        el('span', { class: 'cov-topic-num' }, t.seen + '/' + t.total)
      ));
    });
    const card = el('details', { class: 'cov-card' }, summary, body);
    root.appendChild(card);
  }

  // ===== 4. 教科別の苦手分野 =====
  root.appendChild(el('div', { class: 'section-label' }, '🎯 教科別・苦手分野', el('div', { class: 'deco' })));
  let hasWrongs = false;
  for (const s of SUBJECTS) {
    const wrongs = (state.data.wrongs && state.data.wrongs[s.id]) || [];
    if (wrongs.length === 0) continue;
    hasWrongs = true;

    const topics = getTopicDistribution(wrongs);
    const maxCount = Math.max(1, ...topics.map(t => t[1]));

    const topicList = el('div', { class: 'topic-list' });
    topics.forEach(([name, count]) => {
      const pct = (count / maxCount * 100);
      topicList.appendChild(el('div', {
        class: 'topic-row',
        style: 'background: linear-gradient(to right, ' + s.color + '24 0%, ' + s.color + '24 ' + pct + '%, var(--surface-2) ' + pct + '%);'
      },
        el('span', { class: 'topic-name' }, name),
        el('span', { class: 'topic-num' }, count + '問')
      ));
    });

    root.appendChild(el('div', { class: 'topic-card' },
      el('div', { class: 'topic-header' },
        el('span', { class: 'topic-emoji' }, s.emoji),
        el('span', { class: 'topic-subject' }, s.ja),
        el('span', { class: 'topic-count' }, wrongs.length + '問')
      ),
      topicList,
      el('button', {
        class: 'topic-review-btn',
        style: 'background:' + s.color,
        onclick: () => startQuiz(s.id, true)
      }, '✦ ' + s.ja + 'の苦手だけ復習')
    ));
  }
  if (!hasWrongs) {
    root.appendChild(el('div', { class: 'empty-state' }, '✨ 苦手な問題はまだないよ！'));
  }

  // ===== 4. 最近のセッション =====
  root.appendChild(el('div', { class: 'section-label' }, '📝 最近のセッション', el('div', { class: 'deco' })));
  if (history.length === 0) {
    root.appendChild(el('div', { class: 'empty-state' }, 'まだセッション記録がありません'));
  } else {
    const sList = el('div', { class: 'session-list' });
    const recent = history.slice(-20).reverse();
    recent.forEach(h => {
      const subj = SUBJECTS.find(x => x.id === h.subject);
      if (!subj) return;
      const d = parseDateKey(h.date);
      const dateLabel = (d.getMonth() + 1) + '/' + d.getDate();
      const pct = Math.round(100 * h.correct / h.total);
      sList.appendChild(el('div', { class: 'session-item' },
        el('span', { class: 'session-date' }, dateLabel),
        el('span', { class: 'session-subj', style: 'color:' + subj.color },
          subj.emoji + ' ' + subj.ja),
        el('span', { class: 'session-score' }, h.correct + '/' + h.total + ' (' + pct + '%)'),
        h.reviewMode ? el('span', { class: 'session-tag' }, '復習') : null
      ));
    });
    root.appendChild(sList);
  }

  root.appendChild(el('div', { class: 'footnote' },
    history.length > 0 ? '※ 最新200件まで保存' : 'まだ記録がないよ。問題に挑戦してね！'));
}

// ==================== DATA SCREEN ====================
function renderDataScreen() {
  const root = document.getElementById('screen-data');
  root.innerHTML = '';

  root.appendChild(el('header', { class: 'app-header' },
    el('div', { class: 'brand-area' },
      el('div', { class: 'brand' }, '⚙ 学習データ'),
      el('div', { class: 'brand-sub' }, '書き出し・取り込み')
    ),
    el('button', { class: 'icon-btn', onclick: () => { show('home'); renderHome(); } }, '🏠')
  ));

  root.appendChild(el('div', { class: 'data-note' },
    el('p', null, 'アプリが更新されてURLが変わったときは、ここで「書き出し」→新URLで「取り込み」をすると記録が引き継げます。'),
    el('p', { class: 'data-note-sub' }, '※ 同じURLのまま使えるなら操作は不要です。')
  ));

  const exportJson = JSON.stringify(state.data, null, 2);
  root.appendChild(el('div', { class: 'section-label' }, '書き出し', el('div', { class: 'deco' })));
  const ov = state.data.overall;
  root.appendChild(el('div', { class: 'data-box' },
    el('div', { class: 'data-stats' },
      'のべ ' + ov.totalAnswered + ' 問・正解 ' + ov.totalCorrect + '・セッション ' + ov.sessions
    ),
    el('textarea', {
      class: 'data-text',
      id: 'export-text',
      readOnly: true,
      rows: 6,
      onclick: function() { this.select(); }
    }, exportJson),
    el('button', {
      class: 'btn btn-primary',
      style: 'margin-top: 12px; width: 100%',
      onclick: async () => {
        const ta = document.getElementById('export-text');
        ta.select();
        try {
          await navigator.clipboard.writeText(ta.value);
          showToast('📋 コピーしました！');
        } catch (e) {
          showToast('テキストを長押しでコピーしてね');
        }
      }
    }, '📋 コピー')
  ));

  root.appendChild(el('div', { class: 'section-label' }, '取り込み', el('div', { class: 'deco' })));
  root.appendChild(el('div', { class: 'data-box' },
    el('p', { class: 'data-hint' }, '以前に書き出したテキストを貼り付けてね'),
    el('textarea', {
      class: 'data-text',
      id: 'import-text',
      rows: 6,
      placeholder: 'ここに貼り付け...'
    }),
    el('div', { style: 'display: flex; gap: 10px; margin-top: 12px' },
      el('button', {
        class: 'btn btn-secondary',
        onclick: () => { document.getElementById('import-text').value = ''; }
      }, 'クリア'),
      el('button', {
        class: 'btn btn-accent',
        onclick: () => {
          const txt = document.getElementById('import-text').value.trim();
          if (!txt) { showToast('テキストを貼り付けてね'); return; }
          try {
            const parsed = JSON.parse(txt);
            if (!parsed.overall || !parsed.subjects) {
              showToast('正しい形式じゃないみたい');
              return;
            }
            if (!window.confirm('現在の記録を上書きします。よろしいですか？')) return;
            state.data = parsed;
            if (!state.data.wrongs) state.data.wrongs = {};
            if (!state.data.prefs) state.data.prefs = { sound: true, effects: true };
            saveData();
            showToast('✨ 取り込みました！');
            setTimeout(() => { show('home'); renderHome(); }, 700);
          } catch (e) {
            showToast('読み取れません');
          }
        }
      }, '取り込む')
    )
  ));

  root.appendChild(el('div', { class: 'section-label' }, 'リセット', el('div', { class: 'deco' })));
  root.appendChild(el('div', { class: 'data-box' },
    el('p', { class: 'data-hint' }, '記録をすべて消去します（取り消せません）'),
    el('button', {
      class: 'btn',
      style: 'background: var(--error-soft); color: var(--error); border: 2px solid var(--error-soft); width: 100%; margin-top: 6px',
      onclick: () => {
        if (!window.confirm('本当にすべての記録を消去しますか？')) return;
        state.data = newData();
        saveData();
        showToast('リセットしました');
        setTimeout(() => { show('home'); renderHome(); }, 600);
      }
    }, '🗑 すべての記録をリセット')
  ));
}

function showUpdateNotice() {
  let n = document.getElementById('update-notice');
  if (n) return;
  n = document.createElement('div');
  n.id = 'update-notice';
  n.className = 'update-notice';
  n.innerHTML = '<span>🎀 アプリが更新されたよ</span>';
  const btn = document.createElement('button');
  btn.textContent = '反映する';
  btn.onclick = () => location.reload();
  n.appendChild(btn);
  document.body.appendChild(n);
  setTimeout(() => n.classList.add('visible'), 50);
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('visible');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('visible'), 2200);
}

// ==================== INIT ====================
(function init() {
  state.data = loadData();
  // service worker（更新検知付き）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateNotice();
            }
          });
        });
      }).catch(() => {});
    });
  }
  renderHome();
  setTimeout(() => {
    const l = document.getElementById('loading');
    l.classList.add('gone');
    setTimeout(() => l.remove(), 400);
  }, 250);
})();
</script>
